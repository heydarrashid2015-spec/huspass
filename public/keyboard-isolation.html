<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keyboard isolation — HusPass</title>
</head>
<body>
  <h1>Keyboard isolation</h1>
  <p>This page has no JavaScript, CSS, React, event handlers, or keyboard recovery.</p>
  <p>Tap the field, then long-press space to change language.</p>
  <label for="keyboard-plain">Plain input</label>
  <input id="keyboard-plain" type="text" autocomplete="off">
  <p><label for="keyboard-multi">Plain textarea</label></p>
  <textarea id="keyboard-multi" rows="3"></textarea>
</body>
</html>
