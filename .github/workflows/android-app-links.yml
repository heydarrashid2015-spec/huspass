name: Android App Links validation build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-app-links.yml'
      - 'scripts/configure-android-app-links.mjs'
      - 'scripts/configure-android-release.mjs'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor Android project
        run: |
          mkdir -p out
          printf '<!doctype html><title>HusPass</title>' > out/index.html
          npx cap add android
      - name: Configure verified HTTPS app links
        run: node scripts/configure-android-app-links.mjs
      - name: Validate release version configuration
        env:
          HUSPASS_VERSION_CODE: '2000000000'
        run: |
          node scripts/configure-android-release.mjs
          grep -q 'versionCode 2000000000' android/app/build.gradle
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle
      - name: Verify Android manifest
        run: |
          grep -q 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="www.huspass.dk"' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK and unsigned release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: huspass-android-debug-app-links
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: huspass-android-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
