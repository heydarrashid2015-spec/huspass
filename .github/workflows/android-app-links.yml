name: Android App Links validation build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-app-links.yml'
      - 'scripts/configure-android-app-links.mjs'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor Android project
        run: |
          mkdir -p out
          printf '<!doctype html><title>HusPass</title>' > out/index.html
          npx cap add android
      - name: Configure verified HTTPS app links
        run: node scripts/configure-android-app-links.mjs
      - name: Verify Android manifest
        run: |
          grep -q 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="www.huspass.dk"' android/app/src/main/AndroidManifest.xml
      - name: Build unsigned-for-Play debug test APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: huspass-android-debug-app-links
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
