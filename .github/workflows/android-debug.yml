name: Android test and Play bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-debug.yml"
      - "capacitor.config.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor web directory
        run: mkdir -p out && printf '<!doctype html><html><body></body></html>' > out/index.html
      - name: Add Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HusPass-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Play-ready unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: HusPass-Android-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
