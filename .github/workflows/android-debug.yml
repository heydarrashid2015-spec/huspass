name: Android test and Play bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-debug.yml"
      - "capacitor.config.ts"
      - "package.json"
      - "app/icon.js"
      - "app/apple-icon.js"
      - "app/pwa-192/route.js"
      - "app/pwa-512/route.js"
      - "app/privatliv/page.js"
      - "app/vilkaar/page.js"
      - "app/download/page.js"
      - "next.config.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor web directory
        run: mkdir -p out && printf '<!doctype html><html><body></body></html>' > out/index.html
      - name: Generate approved HusPass launcher artwork
        run: |
          cat > /tmp/huspass-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25c8f2"/><stop offset=".5" stop-color="#0876c9"/><stop offset="1" stop-color="#09265f"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#72e42c"/><stop offset="1" stop-color="#008d62"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="15" fill="white"/><path d="M8 36C8 21 19 9 34 7 22 13 15 23 15 35c0 10 6 18 16 22H17C11 51 8 44 8 36Z" fill="#20bfe7"/><path d="M14 31 32 14l18 17-4 4-14-13-14 13Z" fill="url(#b)"/><path d="M19 34 32 23l13 11v16H19Z" fill="#102f68"/><g fill="white"><rect x="27" y="34" width="4" height="4" rx=".5"/><rect x="33" y="34" width="4" height="4" rx=".5"/><rect x="27" y="40" width="4" height="4" rx=".5"/><rect x="33" y="40" width="4" height="4" rx=".5"/></g><path d="M36 52C39 41 46 35 56 33c1 11-3 20-13 25Z" fill="url(#g)"/><path d="m41 48 4 4 8-10" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          SVG
          npx --yes sharp-cli -i /tmp/huspass-icon.svg -o /tmp/huspass-icon.png resize 512 512
      - name: Add Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install HusPass Android launcher icons
        run: |
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="android/app/src/main/res/$1"
            size="$2"
            mkdir -p "$dir"
            npx --yes sharp-cli -i /tmp/huspass-icon.png -o "$dir/ic_launcher.png" resize "$size" "$size"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done
      - name: Set Android release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode 1")
          s=s.replace('versionName "1.0"', 'versionName "1.0.0"')
          p.write_text(s)
          PY
      - name: Verify Android release identity
        run: |
          grep -q '"version": "1.0.0"' package.json
          grep -q 'applicationId "dk.huspass.app"' android/app/build.gradle
          grep -q 'versionCode 1' android/app/build.gradle
          grep -q 'versionName "1.0.0"' android/app/build.gradle
          grep -q 'https://www.huspass.dk' capacitor.config.ts
          if grep -R -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|service_account|private_key_id' android capacitor.config.ts package.json 2>/dev/null; then
            echo "Potential secret material detected in Android release inputs."
            exit 1
          fi
      - name: Check signing-secret readiness
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          [ -n "$KEYSTORE_B64" ] && present=$((present+1))
          [ -n "$KEYSTORE_PASSWORD" ] && present=$((present+1))
          [ -n "$KEY_ALIAS" ] && present=$((present+1))
          [ -n "$KEY_PASSWORD" ] && present=$((present+1))
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "Android signing secrets are only partially configured."
            exit 1
          fi
          if [ "$present" -eq 4 ]; then
            echo "Android signing secrets are complete."
          else
            echo "Android signing secrets are not configured yet; unsigned AAB only."
          fi
      - name: Verify no environment files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Tracked environment file detected."
            exit 1
          fi
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Verify privacy-sensitive Android configuration
        run: |
          grep -q 'cleartext: false' capacitor.config.ts
          grep -q 'allowNavigation: \["huspass.dk", "www.huspass.dk"\]' capacitor.config.ts
          if grep -R -n -E 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|RECORD_AUDIO|CAMERA' android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "Unexpected privacy-sensitive Android permission detected."
            exit 1
          fi
      - name: Verify required public release pages
        run: |
          for url in https://www.huspass.dk/ https://www.huspass.dk/privatliv https://www.huspass.dk/vilkaar https://www.huspass.dk/download; do
            code=$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done
          privacy=$(curl -L --silent --show-error https://www.huspass.dk/privatliv)
          printf '%s' "$privacy" | grep -q 'kamera'
          printf '%s' "$privacy" | grep -q 'mikrofon'
          printf '%s' "$privacy" | grep -q 'placering'
          printf '%s' "$privacy" | grep -q 'kontakter'
          printf '%s' "$privacy" | grep -q 'slette din konto'
          terms=$(curl -L --silent --show-error https://www.huspass.dk/vilkaar)
          printf '%s' "$terms" | grep -q 'HusPass'
          printf '%s' "$terms" | grep -q 'betalt HusPass Plus'
          download=$(curl -L --silent --show-error https://www.huspass.dk/download)
          printf '%s' "$download" | grep -q 'Android-testversion'
          printf '%s' "$download" | grep -q 'uden for Google Play'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify generated Android manifest
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$manifest"
          if grep -E 'android.permission.(ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS)' "$manifest"; then
            echo "Unexpected sensitive permission found in generated Android manifest."
            exit 1
          fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Verify Android release artifacts
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          apk_size=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          aab_size=$(stat -c%s android/app/build/outputs/bundle/release/app-release.aab)
          echo "APK bytes: $apk_size"
          echo "AAB bytes: $aab_size"
          [ "$apk_size" -gt 100000 ] || exit 1
          [ "$aab_size" -gt 100000 ] || exit 1
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/bundle/release/app-release.aab
      - name: Write Android artifact checksums
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > HusPass-Android-v1.0.0-SHA256.txt
          sha256sum android/app/build/outputs/bundle/release/app-release.aab >> HusPass-Android-v1.0.0-SHA256.txt
      - name: Publish shareable Android test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HusPass-Android-test.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --title "HusPass Android test" --notes "Testing build of HusPass for Android. This is a prerelease build distributed outside Google Play." --prerelease
          gh release upload android-test HusPass-Android-test.apk HusPass-Android-v1.0.0-SHA256.txt --clobber
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HusPass-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Play-ready unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: HusPass-Android-release-v1.0.0-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
