name: Password recovery safety checks

on:
  push:
    branches:
      - 'fix/password-recovery-email-safety-20261111'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Password recovery contract and runtime tests
        run: npm run test:password-recovery
