name: Password recovery safety checks

on:
  push:
    branches:
      - 'fix/password-recovery-email-safety-20261111'
    paths:
      - 'app/page.js'
      - 'tests/password-recovery*.test.mjs'
      - '.github/workflows/password-recovery-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/page.js'
      - 'tests/password-recovery*.test.mjs'
      - '.github/workflows/password-recovery-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Password recovery contract and runtime tests
        run: node --test tests/password-recovery*.test.mjs
