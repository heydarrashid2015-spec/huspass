name: Generate reproducible dependency lockfile
on:
  workflow_dispatch:
  push:
    branches: [security/turnstile-auth-prep]
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve dependency lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile
        run: |
          node -e 'const p=require("./package.json");const l=require("./package-lock.json");if(l.name!==p.name||l.version!==p.version||l.lockfileVersion<3)process.exit(1)'
      - name: Upload lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: huspass-package-lock-review
          path: package-lock.json
          retention-days: 14
      - name: Commit validated lockfile to test branch only
        if: github.ref == 'refs/heads/security/turnstile-auth-prep'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock npm dependency tree for reproducible builds"
            git push origin HEAD:security/turnstile-auth-prep
          fi
