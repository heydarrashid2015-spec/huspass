name: HusPass browser smoke tests
on:
  push:
    branches: [feat/smart-document-archive-ocr-20261111]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: node --test tests/document-*.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  supabase-rls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCUMENT_REQUIRE_RLS: '1'
      SUPABASE_URL: ${{ secrets.DOCUMENT_TEST_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.DOCUMENT_TEST_SUPABASE_ANON_KEY }}
      DOCUMENT_TEST_OWNER_JWT: ${{ secrets.DOCUMENT_TEST_OWNER_JWT }}
      DOCUMENT_TEST_OTHER_JWT: ${{ secrets.DOCUMENT_TEST_OTHER_JWT }}
      DOCUMENT_TEST_ID: ${{ secrets.DOCUMENT_TEST_ID }}
      DOCUMENT_TEST_FILE_PATH: ${{ secrets.DOCUMENT_TEST_FILE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/document-supabase-rls.integration.test.mjs
