name: Android signed Play release (manual)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must exceed the version currently on Play)'
        required: true
        type: number

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: google-play-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check required signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing credential: ${name}"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: |
          mkdir -p out
          printf '<!doctype html><title>HusPass</title>' > out/index.html
          npx cap add android
          node scripts/configure-android-app-links.mjs
      - name: Install approved HusPass launcher icons
        run: |
          npx --yes sharp-cli -i public/huspass-icon.svg -o /tmp/huspass-icon.png resize 512 512
          find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name 'ic_launcher_round*' \) -delete
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="android/app/src/main/res/$1"
            mkdir -p "$dir"
            npx --yes sharp-cli -i /tmp/huspass-icon.png -o "$dir/ic_launcher.png" resize "$2" "$2"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          if find android/app/src/main/res -path '*mipmap-anydpi-v26*' -type f -name 'ic_launcher*.xml' | grep -q .; then
            echo "::error::Unexpected default adaptive launcher remains"
            exit 1
          fi
      - name: Upgrade generated Android Gradle plugin for API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for q in Path("android").rglob("*"):
              if q.is_file() and q.suffix in {".gradle", ".kts"}:
                  try:
                      s=q.read_text()
                  except UnicodeDecodeError:
                      continue
                  s=s.replace("com.android.tools.build:gradle:8.7.2", "com.android.tools.build:gradle:8.9.1")
                  s=s.replace('id "com.android.application" version "8.7.2"', 'id "com.android.application" version "8.9.1"')
                  s=s.replace('id("com.android.application") version "8.7.2"', 'id("com.android.application") version "8.9.1"')
                  q.write_text(s)
          PY
      - name: Restore upload keystore and configure release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HUSPASS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUSPASS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUSPASS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HUSPASS_VERSION_CODE: ${{ inputs.version_code }}
          HUSPASS_SIGN_RELEASE: 'true'
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/huspass-upload.jks"
          chmod 600 "$RUNNER_TEMP/huspass-upload.jks"
          echo "HUSPASS_KEYSTORE_PATH=$RUNNER_TEMP/huspass-upload.jks" >> "$GITHUB_ENV"
          HUSPASS_KEYSTORE_PATH="$RUNNER_TEMP/huspass-upload.jks" node scripts/configure-android-release.mjs
      - name: Verify signed release configuration
        run: |
          grep -q 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="www.huspass.dk"' android/app/src/main/AndroidManifest.xml
          grep -q 'signingConfig signingConfigs.huspassRelease' android/app/build.gradle
      - name: Verify original HusPass upload certificate
        run: |
          ACTUAL=$(keytool -list -v -keystore "$HUSPASS_KEYSTORE_PATH" -alias "$HUSPASS_KEY_ALIAS" -storepass "$HUSPASS_STORE_PASSWORD" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          EXPECTED='3E:B7:34:47:6E:15:96:D7:17:F9:97:43:DC:47:AE:32:8A:87:06:35:1D:C0:45:ED:48:30:41:B3:97:FE:E4:7D'
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::Upload certificate differs from original HusPass v1.0.9 signed AAB'
            exit 1
          fi
        env:
          HUSPASS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUSPASS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build signed release AAB
        working-directory: android
        env:
          HUSPASS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUSPASS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUSPASS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Verify bundle signature and original upload certificate
        env:
          HUSPASS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUSPASS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$BUNDLE" > "$RUNNER_TEMP/jarsigner-verification.log" 2>&1 || {
            cat "$RUNNER_TEMP/jarsigner-verification.log"
            echo "::error::AAB signature verification failed"
            exit 1
          }
          grep -q 'jar verified' "$RUNNER_TEMP/jarsigner-verification.log" || {
            cat "$RUNNER_TEMP/jarsigner-verification.log"
            echo "::error::AAB did not pass signature verification"
            exit 1
          }
          keytool -printcert -jarfile "$BUNDLE" > "$RUNNER_TEMP/aab-certificate.txt"
          EXPECTED='3E:B7:34:47:6E:15:96:D7:17:F9:97:43:DC:47:AE:32:8A:87:06:35:1D:C0:45:ED:48:30:41:B3:97:FE:E4:7D'
          grep -Fq "$EXPECTED" "$RUNNER_TEMP/aab-certificate.txt" || {
            echo "::error::Signed AAB certificate does not match original HusPass upload certificate"
            exit 1
          }
          echo 'AAB signature verified and upload certificate matched'
      - uses: actions/upload-artifact@v4
        with:
          name: huspass-android-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 3
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/huspass-upload.jks"
